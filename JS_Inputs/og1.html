<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> About Myself</h1>
    <script>
        let name=window.prompt("Enter your name"); 
        document.write("<h1> My name is "+name+"</h1>");

        let age=window.prompt("Enter your age");
        document.write("<h1> Iam "+age+"years old</h1>");

        let city=window.prompt("Enter your city");
        document.write("<h1> Iam from city of "+city+"</h1>");

        let college=window.prompt("Enter your college");
        document.write("<h1> Iam from college of "+college+"</h1>");

        let Skills=window.prompt("Enter your Skills");
        document.write("<h1> I have Skills such as "+Skills+"</h1>");
    </script>
</body>
</html>
